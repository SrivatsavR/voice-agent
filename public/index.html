<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meesho Voice AI Platform | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-[#0a0a0f] text-white font-['Outfit'] overflow-hidden">
    <div class="fixed inset-0 z-[-1] opacity-40">
        <img src="dashboard_bg_1771687110761.png" class="w-full h-full object-cover">
    </div>

    <div class="flex h-screen w-full backdrop-blur-sm bg-black/30">
        <!-- Sidebar: History -->
        <aside class="w-80 border-r border-white/10 flex flex-col bg-black/40 backdrop-blur-md">
            <div class="p-6 border-b border-white/10 flex items-center gap-3">
                <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-2 rounded-xl">
                    <i data-lucide="mic" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight">Meesho <span
                        class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">Voice
                        AI</span></h1>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4" id="history-list">
                <div class="text-xs uppercase tracking-widest text-white/40 font-semibold px-2 mb-2">Last 5 Calls</div>
                <!-- History Items go here -->
                <div class="animate-pulse space-y-3">
                    <div class="h-16 bg-white/5 rounded-xl"></div>
                    <div class="h-16 bg-white/5 rounded-xl"></div>
                    <div class="h-16 bg-white/5 rounded-xl"></div>
                </div>
            </div>

            <div class="p-6 border-t border-white/10 bg-black/40">
                <div class="flex items-center gap-3 text-sm text-white/60">
                    <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                    Backend Service: Online
                </div>
            </div>
        </aside>

        <!-- Main Content: Chat -->
        <main class="flex-1 flex flex-col relative">
            <div class="p-6 border-b border-white/10 bg-black/20 flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-semibold" id="agent-status">Onboarding Specialist</h2>
                    <p class="text-sm text-white/40" id="call-id-display">Connecting to workflow...</p>
                </div>
                <div class="flex gap-2">
                    <input type="tel" id="outbound-phone" placeholder="+91..."
                        class="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 w-32 transition-all">
                    <button id="trigger-call"
                        class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg border border-indigo-400/50 shadow-[0_0_15px_rgba(79,70,229,0.4)] transition-all text-sm font-medium flex items-center gap-2">
                        <i data-lucide="phone" class="w-4 h-4"></i> Call
                    </button>
                    <button id="reset-session"
                        class="px-4 py-2 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg transition-all text-sm flex items-center gap-2">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i> Reset
                    </button>
                </div>
            </div>

            <!-- Chat Window -->
            <div class="flex-1 overflow-y-auto p-8 space-y-6 scroll-smooth" id="chat-messages">
                <!-- Welcome Message Bubble -->
                <div class="flex flex-col gap-2 max-w-[80%]">
                    <div class="bg-indigo-600/20 border border-indigo-500/20 p-4 rounded-2xl rounded-tl-none">
                        <p class="text-indigo-100">Hello! I am Asmita from the Meesho seller onboarding team. How can I
                            help you today?</p>
                    </div>
                    <span class="text-[10px] text-white/20 ml-1">SYSTEM AGENT</span>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-8 border-t border-white/10 bg-black/40">
                <form id="chat-form" class="flex gap-4 max-w-4xl mx-auto relative group">
                    <input type="text" id="user-input" placeholder="Type your response as a seller..."
                        class="flex-1 bg-white/5 border border-white/10 hover:border-white/20 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 rounded-2xl px-6 py-4 transition-all text-white placeholder-white/20">
                    <button type="submit"
                        class="bg-indigo-600 p-4 rounded-2xl hover:scale-105 active:scale-95 transition-all shadow-lg overflow-hidden group-focus-within:shadow-indigo-500/20">
                        <i data-lucide="send" class="w-6 h-6"></i>
                    </button>
                </form>
            </div>
        </main>

        <!-- Right Panel: Variables & Logs -->
        <aside class="w-96 border-l border-white/10 flex flex-col bg-black/40 backdrop-blur-md">
            <!-- Tabs -->
            <div class="flex border-b border-white/10 bg-white/5">
                <button
                    class="tab-btn active flex-1 py-4 text-xs uppercase tracking-widest font-bold border-b-2 border-indigo-500"
                    data-tab="variables">Variables</button>
                <button
                    class="tab-btn flex-1 py-4 text-xs uppercase tracking-widest font-bold border-b-2 border-transparent text-white/40"
                    data-tab="logs">Execution Logs</button>
            </div>

            <!-- Variables Tab -->
            <div id="variables-tab" class="flex-1 overflow-y-auto p-6 space-y-6">
                <div class="space-y-4" id="session-variables">
                    <!-- Variable Items -->
                    <div class="text-center py-20 opacity-20">
                        <i data-lucide="layers" class="w-12 h-12 mx-auto mb-4"></i>
                        <p>Waiting for data...</p>
                    </div>
                </div>
            </div>

            <!-- Logs Tab -->
            <div id="logs-tab" class="flex-1 overflow-y-auto p-0 hidden bg-[#050508]">
                <div class="font-mono text-[11px] p-4 text-emerald-500/80 space-y-1" id="log-content">
                    <!-- Logs go here -->
                    <div class="text-white/20 italic">[Console initialized]</div>
                </div>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>

</html>
